; NoodleAI NAI4 — INT8-only firmware. Training still uses FP32 in TensorFlow.js.
; Point NOODLE_LIB_PATH at your Noodle checkout if it is elsewhere.
[platformio]
default_envs = esp32-s3-matrix-int8

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_ffat.csv
build_flags =
    -D NOODLE_USE_INT8
    -D NOODLE_USE_FFAT
    -D NAI_BENCH_FCN=1

[env:esp32-s3-matrix-int8]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    symlink:///home/auralius/works/noodle
    lewisxhe/SensorLib@^0.4.1
    adafruit/Adafruit NeoPixel@^1.12.5

[env:esp32-mpu6050-int8]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D NAI_BOARD_ESP32_MPU6050=1
    ; Optional pin overrides, uncomment when using other wiring:
    -D NAI_GESTURE_BUTTON_PIN=27
    ; -D NAI_IMU_SDA_PIN=21
    ; -D NAI_IMU_SCL_PIN=22
    ; -D NAI_STATUS_LED_PIN=-1
lib_deps =
    symlink:///home/auralius/works/noodle
