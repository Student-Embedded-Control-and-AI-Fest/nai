; NoodleAI ESP32-S3 Matrix: production FP32 selectable FFat / SRAM backends.
; The Noodle library comes from the existing symlinked checkout. Apply the
; FCNMem-default promotion patch to that checkout only if not already applied.
; FCNMem native FP32 uses direct SRAM access by default; FCNFile stays intact.
[env:esp32-s3-matrix]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_ffat.csv
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D NOODLE_USE_FLOAT32
    -D NOODLE_USE_FFAT
lib_deps =
    symlink:///home/auralius/works/noodle
    lewisxhe/SensorLib@^0.4.1
    adafruit/Adafruit NeoPixel@^1.12.5

; Noodle FCNFile from FFat. Same source, adds FCN time & clean PRED time.
[env:esp32-s3-matrix-ffat-bench]
extends = env:esp32-s3-matrix
build_flags =
    ${env:esp32-s3-matrix.build_flags}
    -D SRAM_BACKEND=0
    -D NAI_BENCH_FCN=1

; Production Noodle SRAM backend: FCNMem with optimized direct FP32 weights.
; All weights loaded once when FFat model slot becomes active.
[env:esp32-s3-matrix-sram]
extends = env:esp32-s3-matrix
build_flags =
    ${env:esp32-s3-matrix.build_flags}
    -D SRAM_BACKEND=1
    -D NAI_BENCH_FCN=1


; Experimental BOOT-triggered Mode 1 full INT8 runtime. Uses original FFat
; deployment/segmentation plus Noodle FCNFile packed wNN + pNN metadata.
; Do not use SRAM_BACKEND with this configuration.
[env:esp32-s3-matrix-int8]
extends = env:esp32-s3-matrix
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D NOODLE_USE_INT8
    -D NOODLE_USE_FFAT
    -D NAI_BENCH_FCN=1
